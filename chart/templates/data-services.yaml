{{- $storageClassName := required "storageClassName is required" .Values.storageClassName }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: demo-db
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  instances: 1
  storage:
    size: 1Gi
    storageClass: {{ $storageClassName }}
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 512Mi
---
apiVersion: rabbitmq.com/v1beta1
kind: RabbitmqCluster
metadata:
  name: demo-mq
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  replicas: 1
  persistence:
    storageClassName: {{ $storageClassName }}
    storage: 1Gi
  rabbitmq:
    # The default limit (2 GB) is larger than the volume, so the broker would block all publishers.
    additionalConfig: |
      disk_free_limit.absolute = 100MB
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 512Mi
