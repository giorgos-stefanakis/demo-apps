{{- $store := .Values.secretStore }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo-api-key
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $store.kind }}
    name: {{ required "secretStore.name is required" $store.name }}
  target:
    name: demo-api-key
  data:
    - secretKey: value
      remoteRef:
        key: demo-api-key
        {{- with $store.property }}
        property: {{ . }}
        {{- end }}
{{- if eq .Values.objectStore.type "s3" }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-store-s3
  labels:
    {{- include "demo.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: {{ $store.kind }}
    name: {{ $store.name }}
  target:
    name: object-store-s3
  data:
    {{- range list "access_key_id" "secret_access_key" }}
    - secretKey: {{ . }}
      remoteRef:
        key: object-store
        property: {{ . }}
    {{- end }}
{{- end }}
