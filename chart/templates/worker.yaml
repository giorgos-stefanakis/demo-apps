apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    {{- include "demo.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
        {{- include "demo.podLabels" . | nindent 8 }}
    spec:
      serviceAccountName: worker
      containers:
        - name: worker
          image: {{ include "demo.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "app.worker"]
          env:
            {{- include "demo.env" . | nindent 12 }}
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
